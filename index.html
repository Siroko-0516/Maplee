nt-size:12px;position:absolute;bottom:150px;left:15px;background:#17302ca8;padding:7px 10px;color:#e3e7bf}.dialog{position:absolute;z-index:5;bottom:155px;left:20%;right:20%;padding:18px 22px;background:#fff5dcf5;border:3px solid #94784f;border-radius:5px;color:#493e2a;box-shadow:0 6px 20px #12251c88;font-size:16px;line-height:1.7}.dialog b{color:#4c763f}.dialog p{margin:9px 0 14px}.dialog button{margin:3px}.mapoverlay{position:absolute;inset:16% 10% 24%;z-index:4;background:#fff8e6f5;border:3px solid #92794b;border-radius:7px;padding:25px;color:#4c5a3f}.mapoverlay button{float:right}.mapline{display:flex;gap:7px;margin-top:30px}.mapline div{flex:1;background:#bccc93;border:1px solid #839565;border-radius:4px;text-align:center;padding:25px 4px;font-size:14px}.mobile{display:none;position:absolute;bottom:145px;left:12px;right:12px;justify-content:space-between;pointer-events:none}.mobile button{pointer-events:auto;min-height:46px;min-width:43px;opacity:.9;padding:7px;margin:2px}.note{font-size:11px;color:#b9c8a2;margin-top:5px}.mobile-menu{display:none}@media(pointer:coarse){.mobile{display:flex}.controls{display:none}}@media(max-width:700px){.stats{width:210px;padding:7px}.actions{max-width:220px}.actions button{padding:6px;font-size:12px}.top{top:6px;left:6px;right:6px}.map,.quest{padding:7px 9px;font-size:12px}.map small{font-size:10px}.quest{max-width:55%}.toast{top:85px;font-size:12px}.dialog{left:4%;right:4%;bottom:190px;font-size:14px;padding:12px}.mapoverlay{inset:18% 3% 25%;padding:12px}.mapline{gap:3px}.mapline div{padding:15px 2px;font-size:11px}.hud{left:6px;right:6px;bottom:6px;gap:5px}.controls{display:none}.note{font-size:10px}.mobile{bottom:145px}}
